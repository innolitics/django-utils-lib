[project]
name = "django-utils-lib"
version = "0.2.0"
description = "A utility library for working with Django"
authors = [{ name = "Innolitics" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "typer>=0.24.1,<0.25.0",
    "pydantic>=2.9.2,<3.0.0",
]

[project.scripts]
dul-cli = "django_utils_lib.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6.4,<0.7.0",
    "mypy>=1.11.2,<2.0.0",
    "django-stubs[compatible-mypy]>=5.0.4,<6.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "pytest-django>=4.9.0,<5.0.0",
    "pytest-playwright>=0.5.2,<0.6.0",
    "filelock>=3.16.0,<4.0.0",
    "debugpy>=1.8.5,<2.0.0",
    "django",
    "djangorestframework>=3.15.2,<4.0.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.2,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_utils_lib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "E", "F", "I", "W"]
unfixable = ["F841"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
log_level = "INFO"
log_cli_level = "INFO"
log_cli = true
testpaths = [
    "django_utils_lib/tests"
]
pythonpath = ". django_utils_lib"
django_find_project = false
auto_debug = true
auto_debug_wait_for_connect = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
